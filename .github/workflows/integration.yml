name: Integration checks

on:
  push:
    branches: [integration]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  python-workblocks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pytest
      - name: Test B01
        working-directory: b01-spec-planner
        run: |
          python -m pip install -e '.[test]'
          python run_checks.py all --allow-reference
          python -m pytest -q
      - name: Test B02
        working-directory: b02-workflow-agent
        run: python -m unittest discover -s tests -v
      - name: Test B03
        working-directory: b03/b03_implementation
        run: python -m pytest -q
      - name: Test B04
        working-directory: b04-agent-integration
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Test B06
        working-directory: b06-quality-consensus
        run: |
          python -m pytest -q
          python -m tests.smoke
      - name: Verify second-stage closed loop
        run: python workflow_runtime/verify_contracts.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm run test
      - name: Check task-run API adapter types
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
