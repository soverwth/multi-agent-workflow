[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b01-spec-planner"
version = "1.0.0"
description = "B01 SpecPlannerAgent reference implementation for the multi-agent workflow project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
b01 = "b01.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
